[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "setrecoverypassword"
version = "1.0.1"
description = "Sets random recovery passwords for modern macOS devices via the Jamf API and stores them in 1Password"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "ozpinbeacon" }, { name = "hydazz" }]
keywords = ["jamf", "recovery", "password", "macos", "automation", "1password"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = ["requests>=2.32.4", "APScheduler>=3.11.0", "onepassword>=0.4.1"]

[project.scripts]
setrecoverypassword = "setrecoverypassword:main"

[project.urls]
Homepage = "https://github.com/woodleighschool/SetRecoveryPassword"
Repository = "https://github.com/woodleighschool/SetRecoveryPassword"
Issues = "https://github.com/woodleighschool/SetRecoveryPassword/issues"

[tool.setuptools]
py-modules = ["setrecoverypassword"]
